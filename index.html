<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VISOR</title>
  <meta name="description" content="Tu registro personal de cine y series.">
  <meta name="theme-color" content="#02060c">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VISOR">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Saira:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="field" aria-hidden="true"></div>
  <canvas id="dust" class="dust" aria-hidden="true"></canvas>

  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-core"><span></span><span></span><span></span><div class="boot-count"><i>3</i><i>2</i><i>1</i></div></div>
    <p class="boot-text">INICIALIZANDO VISOR</p>
  </div>

  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="VISOR, inicio">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word">VISOR</span>
    </a>
    <p class="telemetry" id="telemetry" aria-live="polite"></p>
    <a class="icon-btn topbar-settings" href="#ajustes" aria-label="Ajustes" data-icon="settings"></a>
  </header>

  <nav class="dock" aria-label="Secciones">
    <a href="#inicio" data-route="inicio" data-icon="home"><span>Inicio</span></a>
    <a href="#catalogo" data-route="catalogo" data-icon="grid"><span>Catálogo</span></a>
    <a href="#archivo" data-route="archivo" data-icon="archive"><span>Archivo</span></a>
    <a href="#perfil" data-route="perfil" data-icon="profile"><span>Perfil</span></a>
    <a href="#informe" data-route="informe" data-icon="chart"><span>Informe</span></a>
    <a href="#ajustes" data-route="ajustes" data-icon="settings" class="dock-settings"><span>Ajustes</span></a>
  </nav>

  <main id="view" tabindex="-1"></main>
  <div id="overlay"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">VISOR necesita JavaScript activado.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
